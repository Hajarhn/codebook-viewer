function b64ToBytes(b64){
  const bin = atob(b64); const a = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return a;
}
function toggle(){
  const i=document.getElementById('pw'); const b=event.target;
  if(i.type==='password'){i.type='text';b.textContent='hide';}
  else{i.type='password';b.textContent='show';}
}
async function unlock(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  err.classList.remove('show');
  if(!pw){return;}
  btn.disabled=true; btn.textContent='Unlocking...';
  try{
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      'raw', enc.encode(pw), {name:'PBKDF2'}, false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64ToBytes(DATA.salt), iterations:DATA.iter, hash:'SHA-256'},
      baseKey, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:b64ToBytes(DATA.iv)}, key, b64ToBytes(DATA.ct));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }catch(e){
    btn.disabled=false; btn.textContent='Unlock';
    err.classList.add('show');
    document.getElementById('pw').select();
  }
}
</script>
